<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MDEdit</title>
<style>
:root{--bg:#f6f5f1;--surface:#fff;--ink:#1f2328;--muted:#6b7280;--line:#dcdad2;--accent:#1d5fd0;--accent-soft:#e6eefb;--code:#f0eee8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181a;--surface:#1f2123;--ink:#e6e6e3;--muted:#9a9a96;--line:#34363a;--accent:#6ea2ff;--accent-soft:#25324a;--code:#2a2c30;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17181a;--surface:#1f2123;--ink:#e6e6e3;--muted:#9a9a96;--line:#34363a;--accent:#6ea2ff;--accent-soft:#25324a;--code:#2a2c30;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--line)}
header h1{font-size:15px;margin:0 8px 0 0;font-weight:650}
.tb{display:flex;flex-wrap:wrap;gap:2px;align-items:center;padding:6px 12px;background:var(--surface);border-bottom:1px solid var(--line)}
button,select{font:inherit;color:var(--ink);background:transparent;border:1px solid transparent;border-radius:6px;padding:4px 8px;cursor:pointer;min-height:30px}
button:hover{background:var(--accent-soft)}
button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.spacer{flex:1}
select{border-color:var(--line);background:var(--surface)}
main{flex:1;min-height:0;display:flex}
.pane{flex:1;min-width:0;overflow:auto;background:var(--surface)}
.pane+.pane{border-left:1px solid var(--line)}
#editor{max-width:820px;margin:0 auto;padding:28px 24px 80px;outline:none;min-height:100%}
#src{width:100%;height:100%;border:0;resize:none;padding:24px;background:var(--surface);color:var(--ink);font:13.5px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;outline:none}
.hide{display:none}
#editor h1,#editor h2,#editor h3,#editor h4{line-height:1.25;margin:1.4em 0 .5em}
#editor h1{font-size:2em;border-bottom:1px solid var(--line);padding-bottom:.25em}
#editor h2{font-size:1.5em}#editor h3{font-size:1.2em}
#editor p{margin:.7em 0}
#editor a{color:var(--accent)}
#editor blockquote{margin:1em 0;padding:.2em 1em;border-left:4px solid var(--accent);color:var(--muted)}
#editor code{background:var(--code);padding:.15em .35em;border-radius:4px;font:.9em ui-monospace,Menlo,Consolas,monospace}
#editor pre{background:var(--code);padding:12px 14px;border-radius:8px;overflow-x:auto}
#editor pre code{background:none;padding:0}
#editor img{max-width:100%}
#editor hr{border:0;border-top:1px solid var(--line);margin:1.5em 0}
#editor table{border-collapse:collapse;margin:1em 0;max-width:100%}
#editor th,#editor td{border:1px solid var(--line);padding:6px 10px;min-width:60px}
#editor th{background:var(--code)}
#editor ul,#editor ol{padding-left:1.6em}
#editor li input[type=checkbox]{margin-right:.4em}
footer{display:flex;gap:16px;padding:4px 12px;font-size:12px;color:var(--muted);background:var(--surface);border-top:1px solid var(--line)}
#toast{position:fixed;bottom:44px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
@media (max-width:700px){main.split{flex-direction:column}.pane+.pane{border-left:0;border-top:1px solid var(--line)}#editor{padding:18px 14px 60px}}
.grp{display:flex;flex-wrap:wrap;gap:2px;align-items:center}
.ic{display:inline-flex;align-items:center;gap:5px}
.ic svg{display:block;width:16px;height:16px}
#modes button{padding:4px 7px}
#imgDlg{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:20}
#imgDlg .dlg{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;width:min(440px,90vw);display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
#imgDlg h2{font-size:15px;margin:0}
#imgDlg input[type=text]{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
#imgDlg .row{display:flex;gap:8px;align-items:center}
#imgDlg .row button{min-width:0}
.app header{display:none!important}
.app #fn,.app #saved{display:none!important}
</style>
<script src="vendor/marked.min.js"></script>
<script src="vendor/turndown.js"></script>
</head>
<body>
<header>
  <h1>MDEdit</h1>
  <button id="bNew" title="Nieuw document">Nieuw</button>
  <button id="bOpen" title="Open .md bestand">Openen</button>
  <button id="bSave" class="primary" title="Opslaan (Ctrl+S) — schrijft direct naar het geopende bestand">Opslaan</button>
  <button id="bSaveAs" title="Opslaan als nieuw bestand">Opslaan als…</button>
  <label id="autoWrap" class="hide" style="font-size:13px;color:var(--muted);display:flex;gap:4px;align-items:center" title="Wijzigingen automatisch naar het bestand schrijven"><input type="checkbox" id="auto">Auto-opslaan</label>
  <span class="spacer"></span>
  <button id="bTheme" title="Thema wisselen">◐</button>
  <input type="file" id="file" accept=".md,.markdown,.txt,text/markdown,text/plain" class="hide">
</header>
<div class="tb" id="tb">
  <div class="grp" id="fmt">
    <select id="blk" title="Blokstijl">
      <option value="p">Alinea</option><option value="h1">Kop 1</option><option value="h2">Kop 2</option><option value="h3">Kop 3</option><option value="h4">Kop 4</option><option value="blockquote">Citaat</option><option value="pre">Codeblok</option>
    </select>
    <span class="sep"></span>
    <button data-c="bold" title="Vet (Ctrl+B)"><b>B</b></button>
    <button data-c="italic" title="Cursief (Ctrl+I)"><i>I</i></button>
    <button data-c="strikeThrough" title="Doorhalen"><s>S</s></button>
    <button data-c="code" title="Inline code">&lt;/&gt;</button>
    <button data-c="quote" id="bQuote" title="Citaat">❝ Citaat</button>
    <button data-c="codeblock" id="bCodeBlock" title="Codeblok">{ } Codeblok</button>
    <span class="sep"></span>
    <button data-c="insertUnorderedList" title="Opsomming">• Lijst</button>
    <button data-c="insertOrderedList" title="Genummerde lijst">1. Lijst</button>
    <button data-c="task" title="Takenlijst">☑ Taak</button>
    <span class="sep"></span>
    <button data-c="link" title="Link (Ctrl+K)">Link</button>
    <button data-c="image" title="Afbeelding invoegen (URL of bestand)">Afbeelding</button>
    <button data-c="table" title="Tabel invoegen">Tabel</button>
    <button data-c="insertHorizontalRule" title="Horizontale lijn">―</button>
    <span class="sep"></span>
    <button data-c="undo" title="Ongedaan (Ctrl+Z)">↶</button>
    <button data-c="redo" title="Opnieuw (Ctrl+Y)">↷</button>
    <button data-c="removeFormat" title="Opmaak wissen">Tx</button>
  </div>
  <span class="spacer"></span>
  <div id="modes">
    <button data-m="wysiwyg" class="on ic" title="Editor" aria-label="Editor"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
    <button data-m="split" class="ic" title="Gesplitst" aria-label="Gesplitst"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16"/></svg></button>
    <button data-m="source" class="ic" title="Markdown-bron" aria-label="Markdown-bron"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 8-4 4 4 4"/><path d="m15 8 4 4-4 4"/></svg></button>
  </div>
  <span class="sep"></span>
  <button id="bExpHtml" class="ic" title="Exporteren naar HTML"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg><span>HTML</span></button>
  <button id="bExpWord" class="ic" title="Exporteren naar MS Word"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg><span>Word</span></button>
  <button id="bExpWiki" class="ic" title="Exporteren naar MediaWiki-markup"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg><span>Wiki</span></button>
</div>
<main id="main">
  <div class="pane" id="pe"><div id="editor" contenteditable="true" spellcheck="true"></div></div>
  <div class="pane hide" id="ps"><textarea id="src" spellcheck="false" placeholder="Markdown…"></textarea></div>
</main>
<footer><span id="fn">document.md</span><span id="stat">0 woorden</span><span id="saved"></span></footer>
<div id="toast"></div>
<div id="imgDlg" class="hide">
  <div class="dlg">
    <h2>Afbeelding invoegen</h2>
    <input id="imgUrl" type="text" placeholder="https://… (of pad)">
    <input id="imgAlt" type="text" placeholder="Alternatieve tekst (optioneel)">
    <div class="row">
      <button id="imgPick">Bestand kiezen…</button>
      <span class="spacer"></span>
      <button id="imgCancel">Annuleren</button>
      <button id="imgOk" class="primary">Invoegen</button>
    </div>
    <input id="imgFile" type="file" accept="image/*" class="hide">
  </div>
</div>
<script>
(function(){
const $=s=>document.querySelector(s);
const ed=$('#editor'), src=$('#src'), main=$('#main');
marked.setOptions({gfm:true,breaks:false});
const td=new TurndownService({headingStyle:'atx',codeBlockStyle:'fenced',bulletListMarker:'-',emDelimiter:'*',strongDelimiter:'**',hr:'---'});
td.addRule('strike',{filter:['del','s','strike'],replacement:c=>'~~'+c+'~~'});
td.addRule('task',{filter:n=>n.nodeName==='INPUT'&&n.type==='checkbox',replacement:(c,n)=>n.checked?'[x] ':'[ ] '});
td.addRule('table',{filter:'table',replacement:(c,n)=>{
  const rows=[...n.rows].map(r=>[...r.cells].map(x=>td.turndown(x.innerHTML).replace(/\n+/g,' ').replace(/\|/g,'\\|').trim()));
  if(!rows.length)return '';
  const w=Math.max(...rows.map(r=>r.length));
  const pad=r=>{while(r.length<w)r.push('');return '| '+r.join(' | ')+' |'};
  const out=[pad(rows[0]),'| '+Array(w).fill('---').join(' | ')+' |',...rows.slice(1).map(pad)];
  return '\n\n'+out.join('\n')+'\n\n';}});
td.keep([]);

function clean(html){
  const t=document.createElement('template'); t.innerHTML=html;
  t.content.querySelectorAll('script,style,iframe,object,embed,link,meta').forEach(e=>e.remove());
  t.content.querySelectorAll('*').forEach(e=>{[...e.attributes].forEach(a=>{
    const n=a.name.toLowerCase();
    if(n.startsWith('on')||(['href','src'].includes(n)&&/^\s*javascript:/i.test(a.value)))e.removeAttribute(a.name);
    else if(!['href','src','alt','title','type','checked','colspan','rowspan','start','class'].includes(n))e.removeAttribute(a.name);
  });});
  return t.innerHTML;
}
const toHTML=md=>clean(marked.parse(md||''));
const toMD=()=>td.turndown(ed.innerHTML).trim()+'\n';

let mode='wysiwyg', lock=false, timer=null, fromNative=false, bridgeReady=false;
function stats(){const t=src.value.replace(/[#>*_`~\-\[\]()|!]/g,' ').trim();$('#stat').textContent=(t?t.split(/\s+/).length:0)+' woorden · '+src.value.length+' tekens'}
function persist(){if(bridgeReady&&!fromNative&&window.webkit&&webkit.messageHandlers&&webkit.messageHandlers.md)webkit.messageHandlers.md.postMessage(src.value);dirty=true;label();clearTimeout(timer);timer=setTimeout(()=>{try{localStorage.setItem('md-editor-doc',src.value)}catch(e){}
  if(handle&&dirty&&$('#auto').checked)writeHandle().catch(()=>{$('#saved').textContent='Auto-opslaan mislukt'});},500)}
const pe=$('#pe');let raf=0,syncing=false;
// Editor -> Markdown: elke DOM-wijziging (typen, knoppen, undo/redo, plakken, vinkjes) werkt de bron direct bij
const mo=new MutationObserver(()=>{if(!lock){cancelAnimationFrame(raf);raf=requestAnimationFrame(fromEditor)}});
mo.observe(ed,{childList:true,subtree:true,characterData:true,attributes:true});
function fromEditor(){
  if(lock)return;lock=true;
  const md=toMD();
  if(md!==src.value){
    const st=src.scrollTop,a=src.selectionStart,b=src.selectionEnd,f=document.activeElement===src;
    src.value=md;src.scrollTop=st;
    if(f)src.setSelectionRange(Math.min(a,md.length),Math.min(b,md.length));
  }
  lock=false;stats();persist();
}
// Markdown -> editor: bij elke toetsaanslag opnieuw renderen, scrollpositie behouden
function renderEditor(md){lock=true;const st=pe.scrollTop;ed.innerHTML=toHTML(md);mo.takeRecords();pe.scrollTop=st;lock=false}
function fromSource(){renderEditor(src.value);stats();persist()}
function setMD(md){src.value=md;renderEditor(md);stats();persist()}
src.addEventListener('input',fromSource);
// Scroll synchroon houden in gesplitste weergave
function link(a,b){a.addEventListener('scroll',()=>{if(mode!=='split'||syncing)return;syncing=true;const r=a.scrollTop/Math.max(1,a.scrollHeight-a.clientHeight);b.scrollTop=r*(b.scrollHeight-b.clientHeight);requestAnimationFrame(()=>syncing=false)})}
link(pe,src);link(src,pe);

function setMode(m){
  mode=m;
  $('#pe').classList.toggle('hide',m==='source');
  $('#ps').classList.toggle('hide',m==='wysiwyg');
  main.classList.toggle('split',m==='split');
  document.querySelectorAll('#modes button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
  $('#fmt').style.display=m==='source'?'none':'flex';
  if(m==='source')src.focus(); else ed.focus();
}
$('#modes').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setMode(b.dataset.m)});

function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1800)}
function exec(c,v){ed.focus();document.execCommand(c,false,v);fromEditor();sync()}
function selHTML(){const s=getSelection();if(!s.rangeCount)return '';const d=document.createElement('div');d.appendChild(s.getRangeAt(0).cloneContents());return d.innerHTML}
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function insertHTML(h){exec('insertHTML',h)}

function action(c){
  ed.focus();
  switch(c){
    case 'code':{const s=getSelection().toString();
      const p=getSelection().anchorNode&&getSelection().anchorNode.parentElement;
      if(p&&p.closest('code')&&!p.closest('pre')){const cd=p.closest('code');cd.replaceWith(document.createTextNode(cd.textContent));fromEditor();}
      else insertHTML('<code>'+(esc(s)||'code')+'</code>&nbsp;');break}
    case 'quote':exec('formatBlock',currentBlock()==='blockquote'?'p':'blockquote');break;
    case 'codeblock':exec('formatBlock',currentBlock()==='pre'?'p':'pre');break;
    case 'task':insertHTML('<ul><li><input type="checkbox">&nbsp;'+(esc(getSelection().toString())||'Taak')+'</li></ul>');break;
    case 'link':{const u=prompt('URL van de link:','https://');if(u){getSelection().isCollapsed?insertHTML('<a href="'+esc(u)+'">'+esc(u)+'</a>'):exec('createLink',u)}break}
    case 'image':openImageDialog();break;
    case 'table':{const r=parseInt(prompt('Aantal rijen (excl. kop):','2'),10),k=parseInt(prompt('Aantal kolommen:','3'),10);
      if(r>0&&k>0){let h='<table><thead><tr>'+Array.from({length:k},(_,i)=>'<th>Kop '+(i+1)+'</th>').join('')+'</tr></thead><tbody>';
        for(let i=0;i<r;i++)h+='<tr>'+'<td>&nbsp;</td>'.repeat(k)+'</tr>';insertHTML(h+'</tbody></table><p><br></p>')}break}
    default:exec(c);
  }
}
$('#tb').addEventListener('mousedown',e=>{if(e.target.closest('button'))e.preventDefault()});
$('#tb').addEventListener('click',e=>{const b=e.target.closest('button');if(b)action(b.dataset.c)});
$('#blk').addEventListener('change',e=>{const v=e.target.value;exec('formatBlock',v==='p'?'p':v);});

// Afbeelding invoegen: via URL of via een lokaal bestand
let savedRange=null;
function saveSel(){const s=getSelection();savedRange=(s&&s.rangeCount)?s.getRangeAt(0).cloneRange():null}
function restoreSel(){
  const s=getSelection();s.removeAllRanges();
  if(savedRange){try{s.addRange(savedRange);return}catch(e){}}
  const r=document.createRange();r.selectNodeContents(ed);r.collapse(false);s.addRange(r);
}
function insertImage(src,alt){
  ed.focus();restoreSel();
  document.execCommand('insertHTML',false,'<img src="'+esc(src)+'" alt="'+esc(alt)+'">');
  fromEditor();sync();
}
const imgDlg=$('#imgDlg');
function openImageDialog(){$('#imgUrl').value='';$('#imgAlt').value='';saveSel();imgDlg.classList.remove('hide');$('#imgUrl').focus()}
function closeImageDialog(){imgDlg.classList.add('hide')}
$('#imgCancel').onclick=closeImageDialog;
imgDlg.addEventListener('mousedown',e=>{if(e.target===imgDlg)closeImageDialog()});
$('#imgUrl').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('#imgOk').click()}});
$('#imgOk').onclick=()=>{
  const u=$('#imgUrl').value.trim();
  if(!u){toast('Voer een URL in of kies een bestand');return}
  const a=$('#imgAlt').value.trim();closeImageDialog();insertImage(u,a);
};
$('#imgPick').onclick=()=>$('#imgFile').click();
$('#imgFile').addEventListener('change',e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  if(f.type&&!/^image\//.test(f.type)){toast('Kies een afbeeldingsbestand');return}
  const alt=$('#imgAlt').value.trim(),r=new FileReader();
  r.onload=()=>{closeImageDialog();insertImage(String(r.result),alt)};
  r.onerror=()=>toast('Bestand lezen mislukt');
  r.readAsDataURL(f);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!imgDlg.classList.contains('hide'))closeImageDialog()});

function currentBlock(){
  const s=getSelection();if(!s.anchorNode||!ed.contains(s.anchorNode))return 'p';
  let n=s.anchorNode.nodeType===3?s.anchorNode.parentElement:s.anchorNode;
  while(n&&n!==ed&&!/^(P|H[1-6]|BLOCKQUOTE|PRE|LI|DIV)$/.test(n.nodeName))n=n.parentElement;
  return n&&n!==ed?n.nodeName.toLowerCase():'p';
}
function sync(){
  if(!getSelection().anchorNode||!ed.contains(getSelection().anchorNode))return;
  const t=currentBlock();
  $('#blk').value=['h1','h2','h3','h4','blockquote','pre'].includes(t)?t:'p';
  $('#bQuote').classList.toggle('on',t==='blockquote');
  $('#bCodeBlock').classList.toggle('on',t==='pre');
}
document.addEventListener('selectionchange',sync);

// Markdown-sneltoetsen tijdens typen: "# ", "- ", "1. ", "> ", "```", "---"
ed.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();action('link');return}
  if(e.key!==' '&&e.key!=='Enter')return;
  const s=getSelection();if(!s.isCollapsed||!s.anchorNode||s.anchorNode.nodeType!==3)return;
  const blk=s.anchorNode.parentElement.closest('p,div');if(!blk||blk===ed||blk.closest('li,pre'))return;
  const txt=blk.textContent;
  if(e.key===' '){
    const m=txt.match(/^(#{1,4}|-|\*|\d+\.|>|\[\])$/);if(!m)return;
    e.preventDefault();blk.textContent='';
    const k=m[1];
    if(k[0]==='#')exec('formatBlock','h'+k.length);
    else if(k==='-'||k==='*')exec('insertUnorderedList');
    else if(k==='>')exec('formatBlock','blockquote');
    else if(k==='[]')action('task');
    else exec('insertOrderedList');
  }else if(txt==='---'){e.preventDefault();blk.textContent='';exec('insertHorizontalRule')}
  else if(txt==='```'){e.preventDefault();blk.textContent='';exec('formatBlock','pre')}
});
ed.addEventListener('paste',e=>{
  const h=e.clipboardData.getData('text/html'),t=e.clipboardData.getData('text/plain');
  e.preventDefault();
  if(h)insertHTML(clean(h)); else if(t)insertHTML(toHTML(t));
});
ed.addEventListener('click',e=>{
  if(e.target.matches('input[type=checkbox]')){if(e.target.checked)e.target.setAttribute('checked','');else e.target.removeAttribute('checked');fromEditor()}
  const a=e.target.closest('a');if(a&&(e.ctrlKey||e.metaKey)){window.open(a.href,'_blank','noopener')}
});

// Bestanden
let fname='document.md';
const fsa='showOpenFilePicker' in window;
const ftypes=[{description:'Markdown',accept:{'text/markdown':['.md','.markdown'],'text/plain':['.txt']}}];
let handle=null,dirty=false;
function label(){$('#fn').textContent=(handle?'🔗 ':'')+fname+(dirty?' •':'');$('#autoWrap').classList.toggle('hide',!handle)}
async function openPicker(){
  try{
    const [h]=await showOpenFilePicker({types:ftypes,multiple:false});
    const f=await h.getFile(),text=await f.text();
    handle=h;fname=f.name;setMD(text);dirty=false;label();
    toast('Geopend: '+f.name+' — opslaan schrijft direct naar dit bestand');
  }catch(e){if(e&&e.name==='AbortError')return;toast('Directe bestandstoegang niet beschikbaar hier; gewone upload gebruikt');$('#file').click()}
}

    +'<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"><w:body>'+body+'</w:body></w:document>';
  const contentTypes='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    +'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'
    +'<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'
    +'<Default Extension="xml" ContentType="application/xml"/>'
    +[...exts].map(e=>'<Default Extension="'+e+'" ContentType="'+mimeForExt(e)+'"/>').join('')
    +'<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>'
    +'<Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/>'
    +'<Override PartName="/word/numbering.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.numbering+xml"/>'
    +'</Types>';
  const pkgRels='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    +'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>';
  const docRels='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    +'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
    +'<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>'
    +'<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/numbering" Target="numbering.xml"/>'
    +hyper.join('')+'</Relationships>';
  const stylesXml='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    +'<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">'
    +'<w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri" w:cs="Calibri"/><w:sz w:val="22"/><w:szCs w:val="22"/></w:rPr></w:rPrDefault>'
    +'<w:pPrDefault><w:pPr><w:spacing w:after="160" w:line="276" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults>'
    +'<w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/></w:style>'
    +'<w:style w:type="paragraph" w:styleId="Heading1"><w:name w:val="heading 1"/><w:basedOn w:val="Normal"/><w:next w:val="Normal"/><w:qFormat/><w:pPr><w:keepNext/><w:spacing w:before="320" w:after="120"/></w:pPr><w:rPr><w:b/><w:sz w:val="40"/><w:szCs w:val="40"/></w:rPr></w:style>'
    +'<w:style w:type="paragraph" w:styleId="Heading2"><w:name w:val="heading 2"/><w:basedOn w:val="Normal"/><w:next w:val="Normal"/><w:qFormat/><w:pPr><w:keepNext/><w:spacing w:before="280" w:after="100"/></w:pPr><w:rPr><w:b/><w:sz w:val="32"/><w:szCs w:val="32"/></w:rPr></w:style>'
    +'<w:style w:type="paragraph" w:styleId="Heading3"><w:name w:val="heading 3"/><w:basedOn w:val="Normal"/><w:next w:val="Normal"/><w:qFormat/><w:pPr><w:keepNext/><w:spacing w:before="240" w:after="80"/></w:pPr><w:rPr><w:b/><w:sz w:val="26"/><w:szCs w:val="26"/></w:rPr></w:style>'
    +'<w:style w:type="paragraph" w:styleId="Heading4"><w:name w:val="heading 4"/><w:basedOn w:val="Normal"/><w:next w:val="Normal"/><w:qFormat/><w:pPr><w:keepNext/><w:spacing w:before="200" w:after="80"/></w:pPr><w:rPr><w:b/><w:sz w:val="22"/><w:szCs w:val="22"/></w:rPr></w:style>'
    +'<w:style w:type="paragraph" w:styleId="Quote"><w:name w:val="Quote"/><w:basedOn w:val="Normal"/><w:qFormat/><w:rPr><w:i/><w:color w:val="555555"/></w:rPr></w:style>'
    +'<w:style w:type="paragraph" w:styleId="CodeBlock"><w:name w:val="Code Block"/><w:basedOn w:val="Normal"/><w:rPr><w:rFonts w:ascii="Consolas" w:hAnsi="Consolas" w:cs="Consolas"/><w:sz w:val="20"/><w:szCs w:val="20"/></w:rPr></w:style>'
    +'<w:style w:type="paragraph" w:styleId="ListParagraph"><w:name w:val="List Paragraph"/><w:basedOn w:val="Normal"/></w:style>'
    +'</w:styles>';
  const bullet=['•','◦','▪'].map((g,i)=>'<w:lvl w:ilvl="'+i+'"><w:start w:val="1"/><w:numFmt w:val="bullet"/><w:lvlText w:val="'+g+'"/><w:lvlJc w:val="left"/><w:pPr><w:ind w:left="'+(720+i*360)+'" w:hanging="360"/></w:pPr></w:lvl>').join('');
  const decimal=[0,1,2].map(i=>'<w:lvl w:ilvl="'+i+'"><w:start w:val="1"/><w:numFmt w:val="decimal"/><w:lvlText w:val="%'+(i+1)+'."/><w:lvlJc w:val="left"/><w:pPr><w:ind w:left="'+(720+i*360)+'" w:hanging="360"/></w:pPr></w:lvl>').join('');
  const numberingXml='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    +'<w:numbering xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">'
    +'<w:abstractNum w:abstractNumId="0">'+bullet+'</w:abstractNum>'
    +'<w:abstractNum w:abstractNumId="1">'+decimal+'</w:abstractNum>'
    +'<w:num w:numId="1"><w:abstractNumId w:val="0"/></w:num>'
    +'<w:num w:numId="2"><w:abstractNumId w:val="1"/></w:num>'
    +'</w:numbering>';
  return zipBytes([
    {name:'[Content_Types].xml',data:enc.encode(contentTypes)},
    {name:'_rels/.rels',data:enc.encode(pkgRels)},
    {name:'word/document.xml',data:enc.encode(documentXml)},
    {name:'word/_rels/document.xml.rels',data:enc.encode(docRels)},
    {name:'word/styles.xml',data:enc.encode(stylesXml)},
    {name:'word/numbering.xml',data:enc.encode(numberingXml)}
  ].concat(media));
}
function toBase64(bytes){let s='';const c=0x8000;for(let i=0;i<bytes.length;i+=c)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+c));return btoa(s)}
function deliverFile(filename,mime,content,binary){
  if(bridgeReady&&window.webkit&&webkit.messageHandlers&&webkit.messageHandlers.export){
    webkit.messageHandlers.export.postMessage(binary
      ?{filename:filename,mime:mime,encoding:'base64',data:toBase64(content)}
      :{filename:filename,mime:mime,text:content});
    return;
  }
  try{
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type:mime}));
    a.download=filename;document.body.appendChild(a);a.click();a.remove();toast('Geëxporteerd: '+filename);
  }catch(e){toast('Exporteren mislukt')}
}
async function exportDoc(kind){
  if(kind==='word')deliverFile(docName('.docx'),'application/vnd.openxmlformats-officedocument.wordprocessingml.document',await docxBytes(src.value),true);
  else if(kind==='wiki')deliverFile(docName('.mediawiki'),'text/plain',toWiki(src.value));
  else deliverFile(docName('.html'),'text/html',docHTML(docName('')||'document',toHTML(src.value)));
}
$('#bExpHtml').onclick=()=>exportDoc('html');
$('#bExpWord').onclick=()=>{toast('Word-bestand maken…');exportDoc('word')};
$('#bExpWiki').onclick=()=>{toast('MediaWiki-markup maken…');exportDoc('wiki')};


// Thema
$('#bTheme').onclick=()=>{
  const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
  r.dataset.theme=dark?'light':'dark';
};

const demo=`# Welkom bij MDEdit

- Typ \`> \` voor een citaat, \`---\` voor een lijn

- [x] Editor gebouwd
- [ ] Eigen document schrijven

| Kolom A | Kolom B |

| Een | Twee |

> Alles wat je typt wordt direct als Markdown bijgehouden.
`;
let init=demo;try{init=localStorage.getItem('md-editor-doc')||demo}catch(e){}
setMD(init);dirty=false;label();
if(innerWidth>900)setMode('split');
document.documentElement.classList.add('app');
window.nativeSetText=function(md){bridgeReady=true;if(md===src.value)return;fromNative=true;setMD(md);fromNative=false;dirty=false;label()};
window.__toast=toast;
})();
